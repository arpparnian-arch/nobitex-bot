name: Nobitex Trading Bot

on:
  schedule:
    - cron: '*/15 * * * *'  # اجرای خودکار هر ۱۵ دقیقه
  workflow_dispatch:        # دکمه استارت دستی برای تست لحظه‌ای

permissions:
  contents: write           # مجوز ذخیره تغییرات کیف پول در فایل portfolio.json

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کدهای پروژه
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: نصب ابزارهای تحلیل بازار
        run: pip install requests pandas

      - name: اجرای مغز متفکر ربات
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: ذخیره وضعیت جدید کیف پول در حافظه
        run: |
          git config --global user.name "TradingBot"
          git config --global user.email "bot@users.noreply.github.com"
          git add portfolio.json || true
          git diff --staged --quiet || git commit -m "بروزرسانی کیف پول مجازی"
          git push || true
