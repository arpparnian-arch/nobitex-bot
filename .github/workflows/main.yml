name: Nobitex Trading Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: nobitex-trading-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کدهای پروژه
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: نصب کتابخانه‌های تحلیل بازار
        run: pip install requests pandas urllib3

      - name: اجرای ربات معامله‌گر هوشمند
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: ذخیره ایمن وضعیت کیف پول در حافظه گیت‌هاب
        run: |
          git config --global user.name "TradingBot"
          git config --global user.email "bot@users.noreply.github.com"
          git add portfolio.json || true
          git diff --staged --quiet || (git commit -m "بروزرسانی کیف پول مجازی" && git pull --rebase && git push) || true
